name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/codenest
      REDIS_URL: redis://127.0.0.1:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-nextauth-secret-with-at-least-32-characters
      INVITE_TOKEN_SECRET: ci-only-invite-secret-with-at-least-32-characters
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - name: Build container
        run: docker build -t codenest:ci .
      - name: Verify full stack and measure image
        run: |
          cp .env.example .env
          docker compose up -d --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > coverage/container-health.json; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/api/health
          docker image inspect codenest:ci --format '{{.Size}}' > coverage/docker-image-bytes.txt
          echo "Docker image bytes: $(cat coverage/docker-image-bytes.txt)"
      - name: Stop compose services
        if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
